:root{
  --bg:#faf8f5;--surface:#fff;--surface2:#f5f1ea;
  --border:#e4ddd3;--border2:#ede7dc;
  --text:#1a1816;--muted:#8c8378;--faint:#b8afa4;
  --check:#2d5f3f;--check-bg:#eaf3ed;--check-text:#fff;
  --flag:#c8604c;
  --key-bg:#0d0c0b;--key-text:#faf8f5;
  --now-bg:#fff9e8;--now-dot:#d4a820;--now-border:#e8c84a;
  --hdr:#0d0c0b;--hdr-text:#faf8f5;--hdr-muted:#5a5248;
  --tab-active:#0d0c0b;--tab-active-text:#faf8f5;--tab-text:#8c8378;
  --progress:#2d5f3f;--progress-bg:#e4ddd3;
  --shadow:0 1px 4px rgba(0,0,0,.06);
  --line:#e4ddd3;
  --ff-display:"Bobby Jones","Arial Black",sans-serif;
  --ff-body:"Figtree",-apple-system,system-ui,sans-serif;
  --ff-mono:'SF Mono',ui-monospace,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d0c0b;--surface:#1a1816;--surface2:#211e1a;
  --border:#2a2622;--border2:#332e29;
  --text:#f0ece6;--muted:#7a7168;--faint:#4a4540;
  --check:#4aaa6a;--check-bg:#1a2f1e;
  --flag:#d4705a;
  --key-bg:#faf8f5;--key-text:#0d0c0b;
  --now-bg:#2a2415;--now-dot:#d4a820;--now-border:#a08020;
  --hdr:#0d0c0b;
  --tab-active:#faf8f5;--tab-active-text:#0d0c0b;--tab-text:#5a5248;
  --progress:#4aaa6a;--progress-bg:#2a2622;
  --shadow:0 1px 4px rgba(0,0,0,.3);
  --line:#2a2622;
}}
:root[data-theme=dark]{--bg:#0d0c0b;--surface:#1a1816;--surface2:#211e1a;--border:#2a2622;--border2:#332e29;--text:#f0ece6;--muted:#7a7168;--faint:#4a4540;--check:#4aaa6a;--check-bg:#1a2f1e;--flag:#d4705a;--key-bg:#faf8f5;--key-text:#0d0c0b;--now-bg:#2a2415;--now-dot:#d4a820;--now-border:#a08020;--tab-active:#faf8f5;--tab-active-text:#0d0c0b;--tab-text:#5a5248;--progress:#4aaa6a;--progress-bg:#2a2622;--shadow:0 1px 4px rgba(0,0,0,.3);--line:#2a2622}
:root[data-theme=light]{--bg:#faf8f5;--surface:#fff;--surface2:#f5f1ea;--border:#e4ddd3;--border2:#ede7dc;--text:#1a1816;--muted:#8c8378;--faint:#b8afa4;--check:#2d5f3f;--check-bg:#eaf3ed;--flag:#c8604c;--key-bg:#0d0c0b;--key-text:#faf8f5;--now-bg:#fff9e8;--now-dot:#d4a820;--now-border:#e8c84a;--tab-active:#0d0c0b;--tab-active-text:#faf8f5;--tab-text:#8c8378;--progress:#2d5f3f;--progress-bg:#e4ddd3;--shadow:0 1px 4px rgba(0,0,0,.06);--line:#e4ddd3}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--ff-body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}

/* ── SELECTOR ── */
#selector{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:#0d0c0b;color:#faf8f5}
.sel-star{margin-bottom:20px;color:#faf8f5}
.sel-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#5a5248;margin-bottom:8px;text-align:center}
.sel-title{font-family:var(--ff-display);font-size:clamp(32px,9vw,48px);font-weight:900;letter-spacing:.04em;text-transform:uppercase;text-align:center;line-height:.95;margin-bottom:6px}
.sel-date{font-size:13px;color:#5a5248;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-bottom:52px}
.sel-prompt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#3a3530;margin-bottom:16px}
.sel-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.sel-btn{background:#1a1816;border:1.5px solid #2a2622;border-radius:14px;padding:20px 22px;color:#faf8f5;text-align:left;display:flex;justify-content:space-between;align-items:center;transition:border-color .15s,background .15s}
.sel-btn:active{background:#242018;border-color:#4aaa6a}
.sel-btn-left{display:flex;flex-direction:column;gap:3px}
.sel-btn-name{font-size:18px;font-weight:700;letter-spacing:.02em}
.sel-btn-role{font-size:12px;color:#5a5248}
.sel-btn-arrow{font-size:20px;color:#3a3530}

/* ── APP ── */
#app{display:flex;flex-direction:column;height:100dvh}
.hidden{display:none!important}

/* Header */
.app-hdr{background:var(--hdr);color:var(--hdr-text);padding:max(env(safe-area-inset-top),10px) 20px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.back-btn{background:none;border:none;color:#5a5248;font-size:22px;padding:4px;line-height:1}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-family:var(--ff-display);font-size:17px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:11px;color:#5a5248;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-clock{font-family:var(--ff-mono);font-size:15px;font-weight:600;color:#a09888;font-variant-numeric:tabular-nums}
.theme-btn{background:none;border:none;color:#5a5248;font-size:17px;padding:4px}

/* Progress bar */
.prog-bar{height:3px;background:var(--progress-bg);flex-shrink:0}
.prog-fill{height:100%;background:var(--progress);transition:width .4s ease}

/* Tabs */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:14px 8px;min-height:52px;background:none;border:none;font-family:var(--ff-body);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--tab-text);display:flex;align-items:center;justify-content:center;gap:5px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600}

/* Scrollable content */
.tab-content{flex:1;overflow-y:auto;padding:0 0 max(env(safe-area-inset-bottom),20px)}
.tab-content.hidden{display:none}

/* ── BRIEFING TAB ── */
.brief-section{padding:20px 20px 0}
.brief-section:last-child{padding-bottom:20px}
.brief-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.brief-label::after{content:'';flex:1;height:1px;background:var(--border)}
.brief-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.brief-row{padding:16px 16px;border-bottom:1px solid var(--border2);display:flex;gap:14px;align-items:flex-start}
.brief-row:last-child{border-bottom:none}
.brief-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.brief-text{}
.brief-title{font-size:15px;font-weight:600;margin-bottom:5px;color:var(--text)}
.brief-body{font-size:14px;color:var(--muted);line-height:1.65}
.brief-body strong{color:var(--text);font-weight:600}
.brief-highlight{background:var(--now-bg);border:1px solid var(--now-border);border-radius:10px;padding:14px 16px;margin:16px 20px 0;font-size:14px;line-height:1.6;color:var(--text)}
.brief-highlight strong{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--now-dot);margin-bottom:4px}

/* ── ZEITPLAN TAB ── */
.timeline{padding:16px 16px 8px}
.tl-section-head{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:16px 0 10px;display:flex;align-items:center;gap:8px}
.tl-section-head::after{content:'';flex:1;height:1px;background:var(--border)}
.tl-items{position:relative}
/* Vertical line */
.tl-items::before{content:'';position:absolute;left:23px;top:0;bottom:0;width:1.5px;background:var(--line)}

.tl-item{display:flex;gap:0;margin-bottom:8px;position:relative}
/* Dot on line */
.tl-dot{width:46px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;z-index:1}
.tl-dot-circle{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);background:var(--bg);margin-top:14px;transition:background .2s,border-color .2s;flex-shrink:0}
.tl-item.is-key .tl-dot-circle{width:14px;height:14px;border-color:var(--text);background:var(--text);margin-top:13px}
.tl-item.is-done .tl-dot-circle{background:var(--check);border-color:var(--check)}
.tl-item.is-now .tl-dot-circle{background:var(--now-dot);border-color:var(--now-dot);box-shadow:0 0 0 4px rgba(212,168,32,.2)}
/* Card */
.tl-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.tl-item.is-key .tl-card{border-color:var(--text)}
.tl-item.is-now .tl-card{background:var(--now-bg);border-color:var(--now-border)}
.tl-item.is-done .tl-card{opacity:.5}
.tl-card-row{display:flex;align-items:stretch;min-height:66px}
/* Left accent for key items */
.tl-item.is-key .tl-card-row::before{content:'';width:3px;background:#0d0c0b;flex-shrink:0;border-radius:0}
:root[data-theme=dark] .tl-item.is-key .tl-card-row::before{background:#faf8f5}
.tl-body{flex:1;padding:13px 12px;min-width:0;cursor:pointer}
.tl-time{font-family:var(--ff-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:3px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.tl-now-badge{background:var(--now-dot);color:#3a2e00;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.tl-key-badge{background:var(--text);color:var(--bg);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.tl-title{font-size:15px;font-weight:600;line-height:1.35;color:var(--text)}
.tl-item.is-done .tl-title{text-decoration:line-through;color:var(--muted)}
.tl-sub{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.55}
/* Action buttons */
.tl-actions{display:flex;flex-direction:column;flex-shrink:0;border-left:1px solid var(--border2)}
.check-btn,.flag-btn{background:none;border:none;width:44px;flex:1;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--faint);transition:color .15s}
.check-btn{border-bottom:1px solid var(--border2)}
.tl-item.is-done .check-btn{color:var(--check)}
.tl-item.is-flagged .flag-btn{color:var(--flag)}

/* Note */
.note-toggle{width:100%;background:none;border:none;border-top:1px solid var(--border2);color:var(--faint);font-size:11px;padding:8px 12px;text-align:left;display:flex;align-items:center;gap:6px;letter-spacing:.04em;transition:color .15s}
.note-toggle.has-note{color:var(--check)}
.note-area{display:none;padding:0 12px 10px}
.note-area.open{display:block}
.note-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--ff-body);font-size:13px;padding:9px 11px;resize:none;min-height:56px;outline:none}
.note-input::placeholder{color:var(--faint)}

/* Ongoing items – simpler style */
.ongoing-items{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.ong-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.ong-item.is-done{opacity:.5}
.ong-row{display:flex;align-items:stretch;min-height:56px}
.ong-body{flex:1;padding:11px 12px;cursor:pointer}
.ong-title{font-size:15px;font-weight:600;color:var(--text)}
.ong-item.is-done .ong-title{text-decoration:line-through;color:var(--muted)}
.ong-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55}
.ong-actions{display:flex;flex-direction:column;flex-shrink:0;border-left:1px solid var(--border2)}
.ong-check,.ong-flag{background:none;border:none;width:44px;flex:1;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--faint)}
.ong-check{border-bottom:1px solid var(--border2)}
.ong-item.is-done .ong-check{color:var(--check)}
.ong-item.is-flagged .ong-flag{color:var(--flag)}

/* Progress row */
.prog-row{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-shrink:0}
.prog-row strong{color:var(--text)}

/* Celebrate */
#celebrate{display:none;position:fixed;inset:0;background:rgba(13,12,11,.93);align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:100;text-align:center;padding:32px}
#celebrate.show{display:flex}
.cel-star{font-size:56px;animation:pop .5s ease}
.cel-title{font-family:var(--ff-display);font-size:32px;font-weight:900;color:#faf8f5;letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.cel-sub{font-size:15px;color:#7a7168}
.cel-btn{margin-top:10px;padding:14px 36px;background:#faf8f5;color:#0d0c0b;border:none;border-radius:30px;font-family:var(--ff-body);font-size:15px;font-weight:700}
@keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0}70%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes chk{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.popping{animation:chk .25s ease}

};
let person=null, state={};

function loadState(p){ try{const r=localStorage.getItem('ms26_'+p);if(r){const s=JSON.parse(r);return{checked:new Set(s.c||[]),flagged:new Set(s.f||[]),notes:s.n||{}}}}catch(e){}; return{checked:new Set(),flagged:new Set(),notes:{}} }
function saveState(){ if(!person)return; localStorage.setItem('ms26_'+person,JSON.stringify({c:[...state.checked],f:[...state.flagged],n:state.notes})) }

function boot(p){
  person=p; state=loadState(p);
  document.getElementById('selector').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const d=DATA[p];
  document.getElementById('hdr-name').textContent=d.name;
  document.getElementById('hdr-sub').textContent=d.role;
  renderBrief(); renderPlan();
  updateProg(); startClock();
}
function goBack(){ document.getElementById('app').classList.add('hidden'); document.getElementById('selector').classList.remove('hidden') }
function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.add('hidden'));
  document.getElementById('tab-'+t).classList.add('active');
  document.getElementById('panel-'+t).classList.remove('hidden');
}

/* ── BRIEFING ── */
function renderBrief(){
  const d=DATA[person];
  const p=document.getElementById('panel-brief');
  p.innerHTML=`<div class="brief-highlight"><strong>★ Wichtigster Hinweis</strong>${d.highlight}</div>`;
  const sec=document.createElement('div');
  sec.className='brief-section';
  sec.innerHTML='<div class="brief-label">Briefing</div><div class="brief-card">'+
    d.briefing.map(r=>`<div class="brief-row"><div class="brief-icon">${r.icon}</div><div class="brief-text"><div class="brief-title">${r.title}</div><div class="brief-body">${r.body}</div></div></div>`).join('')+
  '</div>';
  p.appendChild(sec);
}

/* ── ZEITPLAN ── */
function nowMin(){ const n=new Date(); return n.getHours()*60+n.getMinutes() }
function isNow(item){ if(item.min==null)return false; const nm=nowMin(); return nm>=item.min-5&&nm<item.min+30 }

function renderPlan(){
  const d=DATA[person];
  const p=document.getElementById('panel-plan');
  p.innerHTML='';
  const wrap=document.createElement('div');
  wrap.className='timeline';

  // Scheduled
  const sh=document.createElement('div');
  sh.className='tl-section-head';
  sh.textContent='Geplante Momente';
  wrap.appendChild(sh);

  const tl=document.createElement('div');
  tl.className='tl-items';
  d.scheduled.forEach(item=>tl.appendChild(mkTlItem(item)));
  wrap.appendChild(tl);

  // Ongoing
  const oh=document.createElement('div');
  oh.className='tl-section-head';
  oh.textContent='Laufend den ganzen Tag';
  wrap.appendChild(oh);

  const og=document.createElement('div');
  og.className='ongoing-items';
  d.ongoing.forEach(item=>og.appendChild(mkOngItem(item)));
  wrap.appendChild(og);

  p.appendChild(wrap);
}

function mkTlItem(item){
  const el=document.createElement('div');
  el.className='tl-item'+(item.key?' is-key':'')+(state.checked.has(item.id)?' is-done':'')+(state.flagged.has(item.id)?' is-flagged':'')+(isNow(item)?' is-now':'');
  el.id='i-'+item.id;
  const nowB=isNow(item)?'<span class="tl-now-badge">JETZT</span>':'';
  const keyB=item.key&&!isNow(item)?'<span class="tl-key-badge">KEY</span>':'';
  const hasNote=!!state.notes[item.id];
  el.innerHTML=`
    <div class="tl-dot"><div class="tl-dot-circle" id="dc-${item.id}"></div></div>
    <div class="tl-card">
      <div class="tl-card-row">
        <div class="tl-body" onclick="toggleCheck('${item.id}')">
          <div class="tl-time">${item.time} ${nowB}${keyB}</div>
          <div class="tl-title">${item.title}</div>
          <div class="tl-sub">${item.sub}</div>
        </div>
        <div class="tl-actions">
          <button class="check-btn" onclick="toggleCheck('${item.id}')" aria-label="Abhaken">✓</button>
          <button class="flag-btn" onclick="toggleFlag('${item.id}')" aria-label="Flag">★</button>
        </div>
      </div>
      <button class="note-toggle ${hasNote?'has-note':''}" onclick="toggleNote('${item.id}')">✏️ <span id="nl-${item.id}">${hasNote?'Notiz bearbeiten':'Notiz hinzufügen'}</span></button>
      <div class="note-area${hasNote?' open':''}" id="na-${item.id}">
        <textarea class="note-input" id="note-${item.id}" placeholder="Deine Notiz..." oninput="saveNote('${item.id}',this.value)">${state.notes[item.id]||''}</textarea>
      </div>
    </div>`;
  return el;
}

function mkOngItem(item){
  const el=document.createElement('div');
  el.className='ong-item'+(state.checked.has(item.id)?' is-done':'')+(state.flagged.has(item.id)?' is-flagged':'');
  el.id='i-'+item.id;
  const hasNote=!!state.notes[item.id];
  el.innerHTML=`
    <div class="ong-row">
      <div class="ong-body" onclick="toggleCheck('${item.id}')">
        <div class="ong-title">${item.title}</div>
        <div class="ong-sub">${item.sub}</div>
      </div>
      <div class="ong-actions">
        <button class="ong-check" onclick="toggleCheck('${item.id}')">✓</button>
        <button class="ong-flag" onclick="toggleFlag('${item.id}')">★</button>
      </div>
    </div>
    <button class="note-toggle ${hasNote?'has-note':''}" onclick="toggleNote('${item.id}')">✏️ <span id="nl-${item.id}">${hasNote?'Notiz bearbeiten':'Notiz hinzufügen'}</span></button>
    <div class="note-area${hasNote?' open':''}" id="na-${item.id}">
      <textarea class="note-input" id="note-${item.id}" placeholder="Deine Notiz..." oninput="saveNote('${item.id}',this.value)">${state.notes[item.id]||''}</textarea>
    </div>`;
  return el;
}

function allItems(){ const d=DATA[person]; return [...d.scheduled,...d.ongoing] }

function toggleCheck(id){
  state.checked.has(id)?state.checked.delete(id):state.checked.add(id);
  const el=document.getElementById('i-'+id);
  if(el){ el.classList.toggle('is-done',state.checked.has(id)); }
  const dc=document.getElementById('dc-'+id);
  if(dc&&state.checked.has(id)){dc.classList.add('popping');setTimeout(()=>dc.classList.remove('popping'),300)}
  saveState(); updateProg();
}
function toggleFlag(id){
  state.flagged.has(id)?state.flagged.delete(id):state.flagged.add(id);
  document.getElementById('i-'+id)?.classList.toggle('is-flagged',state.flagged.has(id));
  saveState();
}
function toggleNote(id){
  const na=document.getElementById('na-'+id);
  if(na){const o=na.classList.toggle('open');if(o)document.getElementById('note-'+id)?.focus()}
}
function saveNote(id,val){
  val.trim()?state.notes[id]=val:delete state.notes[id];
  const tog=document.getElementById('nl-'+id);
  if(tog){tog.parentElement.classList.toggle('has-note',!!val.trim());tog.textContent=val.trim()?'Notiz bearbeiten':'Notiz hinzufügen'}
  saveState();
}
function updateProg(){
  const items=allItems(),total=items.length,done=items.filter(i=>state.checked.has(i.id)).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-done').textContent=done;
  document.getElementById('prog-total').textContent=total;
  document.getElementById('prog-pct').textContent=pct+'%';
  if(done===total&&total>0)setTimeout(()=>document.getElementById('celebrate').classList.add('show'),500);
}

let _clkInt;
function startClock(){
  function tick(){
    const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
    document.getElementById('hdr-clock').textContent=h+':'+m;
    DATA[person].scheduled.forEach(item=>{
      const el=document.getElementById('i-'+item.id);
      if(el)el.classList.toggle('is-now',isNow(item));
    });
  }
  tick(); clearInterval(_clkInt); _clkInt=setInterval(tick,30000);
}
function toggleTheme(){
  const c=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark');
}
</script>

</body></html>
